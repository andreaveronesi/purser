apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "purser.ui.fullname" . }}
  labels:
    {{- include "purser.componentLabels" (dict "ctx" . "component" "ui") | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "purser.componentSelectorLabels" (dict "ctx" . "component" "ui") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "purser.componentSelectorLabels" (dict "ctx" . "component" "ui") | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if ((.Values.containerSecurityContext).readOnlyRootFilesystem) }}
      # With a read-only root filesystem the UI's runtime-config entrypoint
      # (40-purser-runtime-config.sh) cannot rewrite env.js in the image's web
      # root, so window.__PURSER_CONFIG__ would stay empty and every runtime
      # setting (apiBase, gatewayBase, localAuth, oidc) would be silently
      # ignored. This initContainer copies the baked static bundle into a
      # writable emptyDir that is then mounted over the web root, so the
      # entrypoint can regenerate env.js while the root FS stays read-only.
      initContainers:
        - name: copy-webroot
          image: {{ include "purser.ui.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["/bin/sh", "-c", "cp -a /usr/share/nginx/html/. /webroot/"]
          volumeMounts:
            - name: webroot
              mountPath: /webroot
      {{- end }}
      containers:
        - name: ui
          image: {{ include "purser.ui.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.ui.port }}
          # Consumed at container start by the UI's runtime-config entrypoint,
          # which writes env.js (window.__PURSER_CONFIG__) before nginx serves.
          env:
            - name: PURSER_API_BASE_URL
              value: {{ .Values.ui.apiBaseUrl | quote }}
            - name: PURSER_GATEWAY_BASE_URL
              value: {{ .Values.ui.gatewayBaseUrl | quote }}
            {{- with .Values.ui.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # emptyDir mounts required when readOnlyRootFilesystem=true so nginx
          # can write its cache, pid-file, and temp directories.
          {{- if ((.Values.containerSecurityContext).readOnlyRootFilesystem) }}
          volumeMounts:
            # Writable web root (populated by the copy-webroot initContainer) so
            # the entrypoint can regenerate env.js under a read-only root FS.
            - name: webroot
              mountPath: /usr/share/nginx/html
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-tmp
              mountPath: /tmp
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.ui.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if ((.Values.containerSecurityContext).readOnlyRootFilesystem) }}
      volumes:
        - name: webroot
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
